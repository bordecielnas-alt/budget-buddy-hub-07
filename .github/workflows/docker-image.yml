name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.invalid' }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_build' }}
      run: |
        docker build . \
          --file Dockerfile \
          --secret id=vite_supabase_url,env=VITE_SUPABASE_URL \
          --secret id=vite_supabase_publishable_key,env=VITE_SUPABASE_PUBLISHABLE_KEY \
          --tag my-image-name:$(date +%s)
