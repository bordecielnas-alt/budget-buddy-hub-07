services:
  app:
    build:
      context: .
      secrets:
        - vite_supabase_url
        - vite_supabase_publishable_key
    restart: unless-stopped
    ports:
      # hôte:conteneur — l'app écoute sur 3000 dans le conteneur
      - "3000:3000"
    volumes:
      # Données persistantes (config backend, exports, sauvegardes, cache)
      - ./data:/data
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      # Laissez vide pour utiliser ./data/config/database.env (généré au 1er démarrage)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

secrets:
  vite_supabase_url:
    environment: VITE_SUPABASE_URL
  vite_supabase_publishable_key:
    environment: VITE_SUPABASE_PUBLISHABLE_KEY
